# Chatbot Project 2: Production-Grade RAG Configuration

app:
  name: "SmartDoc Barista Hybrid RAG Assistant"
  version: "2.0.0"
  environment: "production"

document:
  pdf_path: "documents.pdf"

embedding:
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  device: "cpu"

vector_store:
  type: "chroma" # Options: "chroma" or "faiss"
  chroma_path: "chatbot/data/chroma_db"
  faiss_path: "chatbot/data/faiss_index"
  collection_name: "barista_rag_collection"

sparse_retrieval:
  engine: "bm25"
  thai_tokenizer: "newmm"

fusion:
  algorithm: "rrf" # Options: "rrf" or "relative_score"
  rrf_k: 60
  dense_weight: 0.5
  sparse_weight: 0.5

reranker:
  enabled: true
  model_name: "cross-encoder/mmarco-mMiniLMv2-L12-H384-v1"
  top_n: 4

dynamic_optimization:
  default_top_k: 5
  min_top_k: 3
  max_top_k: 8
  max_context_tokens: 2200

llm:
  provider: "ollama"
  model: "qwen2.5:3b"
  base_url: "http://localhost:11434"
  temperature: 0.1
  top_p: 0.9

guardrails:
  strict_context_check: true
  min_similarity_threshold: 0.25
  fallback_message: "ขออภัยครับ ข้อมูลดังกล่าวไม่มีระบุในคู่มือบาริสต้ามืออาชีพที่กำหนด ทางเราจึงไม่สามารถให้คำตอบนอกเหนือจากเอกสารได้ครับ"

server:
  port: 5000
  host: "0.0.0.0"
